<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel de Control - Bitácora</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f7f2; margin: 0; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; background: #4d693f; color: white; padding: 15px 30px; border-radius: 12px; }
        .logout { color: #fcd7de; cursor: pointer; font-weight: bold; }
        .container { max-width: 600px; margin: 30px auto; }
        .form-box { background: white; padding: 25px; border-radius: 16px; border: 1px solid #dbe3da; margin-bottom: 25px; }
        .post { background: white; padding: 20px; border-radius: 16px; margin-bottom: 15px; border: 1px solid #dbe3da; }
        input, textarea { width: 100%; margin-bottom: 12px; padding: 10px; border: 1px solid #c0cca9; border-radius: 8px; box-sizing: border-box; }
        button { background: #4d693f; color: white; border: none; padding: 12px; border-radius: 8px; width: 100%; cursor: pointer; font-weight: bold; }
        img { width: 100%; border-radius: 12px; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="header">
        <h2>🌱 Bitácora Digital del Huerto</h2>
        <span class="logout" onclick="localStorage.clear(); window.location.href='/'">Cerrar Sesión</span>
    </div>

    <div class="container">
        <!-- Formulario de carga rápida -->
        <div class="form-box">
            <h3>Publicar actualización de Planta</h3>
            <input type="text" id="planta" placeholder="Nombre de la planta">
            <input type="text" id="dueno" placeholder="Tu nombre / Equipo">
            <input type="number" id="altura" placeholder="Altura en cm">
            <textarea id="observaciones" placeholder="Notas sobre el estado actual..."></textarea>
            <input type="file" id="foto" accept="image/*">
            <button onclick="publicarEntrada()">Publicar en Muro</button>
        </div>

        <!-- Contenedor dinámico -->
        <div id="muroPublico">Cargando bitácora...</div>
    </div>

    <script>
        const API_URL = 'http://localhost:3000';
        const token = localStorage.getItem('token');

        if(!token) window.location.href = '/';

        async function cargarMuro() {
            const res = await fetch(`${API_URL}/api/bitacora`);
            const datos = await res.json();
            const muro = document.getElementById('muroPublico');
            
            if(datos.length === 0) {
                muro.innerHTML = '<p style="text-align:center; color:#60705a;">Aún no hay publicaciones en el huerto.</p>';
                return;
            }

            muro.innerHTML = datos.map(p => `
                <div class="post">
                    <h4>🌿 Planta: ${p.tipoPlanta}</h4>
                    <p><strong>Responsable:</strong> ${p.dueno} | <strong>Tamaño:</strong> ${p.altura} cm</p>
                    <p><strong>Estado:</strong> ${p.observaciones}</p>
                    ${p.imagenUrl ? `<img src="${p.imagenUrl}">` : ''}
                    <br><small style="color:#aaa;">📅 ${new Date(p.fecha).toLocaleDateString()}</small>
                </div>
            `).join('');
        }

        async function publicarEntrada() {
            const formData = new FormData();
            formData.append('tipoPlanta', document.getElementById('planta').value);
            formData.append('dueno', document.getElementById('dueno').value);
            formData.append('altura', document.getElementById('altura').value);
            formData.append('observaciones', document.getElementById('observaciones').value);
            
            const fileInput = document.getElementById('foto');
            if(fileInput.files[0]) {
                formData.append('imagen', fileInput.files[0]);
            }

            const res = await fetch(`${API_URL}/api/bitacora`, {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${token}` },
                body: formData
            });

            if(res.ok) {
                alert('¡Publicado!');
                location.reload();
            } else {
                alert('Error al publicar. Tu sesión podría haber expirado.');
            }
        }

        cargarMuro();
    </script>
</body>
</html>
