<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MUSU - Panel del Huertito</title>
    <style>
        :root {
            --rosa-principal: #fcd7de;  
            --rosa-intenso: #e58fa2;    
            --rosa-oscuro: #8c4354;     
            --rosa-tarjeta: #fff5f6;    
            --verde-huerto: #4d693f;    
            --verde-hover: #3a502f;     
            --blanco: #ffffff;
            --texto-oscuro: #2c3528;    
        }

        body {
            font-family: '-apple-system', BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0; padding: 0;
            background-color: var(--rosa-principal);
            color: var(--texto-oscuro);
        }

        .header-dash {
            background: linear-gradient(135deg, var(--rosa-oscuro), var(--rosa-intenso));
            color: var(--blanco);
            padding: 25px 20px;
            text-align: center;
            position: relative;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .header-dash h1 { margin: 0; font-size: 2rem; }

        .btn-logout {
            position: absolute; right: 20px; top: 25px;
            background-color: transparent; border: 2px solid var(--blanco);
            color: var(--blanco); padding: 8px 15px; border-radius: 20px;
            cursor: pointer; font-weight: bold; transition: all 0.2s;
        }
        .btn-logout:hover { background-color: var(--blanco); color: var(--rosa-oscuro); }

        .container { max-width: 800px; margin: 30px auto; padding: 0 20px; }

        .bloque-panel {
            background-color: var(--blanco); border-radius: 20px;
            padding: 25px; box-shadow: 0 6px 20px rgba(0,0,0,0.04);
            margin-bottom: 25px;
        }

        .bloque-panel h2 { color: var(--verde-huerto); margin-top: 0; border-bottom: 2px solid #e2ece0; padding-bottom: 8px; }

        input, textarea, select {
            width: 100%; margin-bottom: 15px; padding: 12px;
            border: 1px solid #d0dacb; border-radius: 10px; box-sizing: border-box;
        }

        .btn-guardar {
            width: 100%; padding: 13px; background-color: var(--verde-huerto);
            color: var(--blanco); border: none; border-radius: 10px;
            font-size: 1rem; font-weight: bold; cursor: pointer;
        }
        .btn-guardar:hover { background-color: var(--verde-hover); }

        .tarjeta-bitacora {
            background-color: var(--rosa-tarjeta); border: 1px solid #f7d5dc;
            border-radius: 16px; padding: 20px; margin-bottom: 20px;
        }
        .tarjeta-bitacora h3 { margin-top: 0; color: var(--rosa-oscuro); }

        /* Estilo sutil para diferenciar la sección del admin */
        .bloque-admin {
            border: 2px dashed var(--rosa-intenso);
            background-color: #fffbfa;
        }
        .bloque-admin h2 { color: var(--rosa-oscuro); border-bottom: 2px solid #f7d5dc; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="header-dash">
        <h1 id="saludoDashboard">🌿 Panel de Control - Huertito MUSU</h1>
        <button class="btn-logout" onclick="cerrarSesion()">Cerrar Sesión</button>
    </div>

    <div class="container">
        
        <!-- 👑 MÓDULO EXCLUSIVO PARA ADMINISTRADORES (Agregar nuevos admins) -->
        <div class="bloque-panel bloque-admin hidden" id="moduloAdministrador">
            <h2>👑 Panel de Gestión: Registrar Nuevo Administrador</h2>
            <form id="formNuevoAdmin" onsubmit="event.preventDefault(); registrarAdministrador();">
                <label>Nombre del Nuevo Administrador:</label>
                <input type="text" id="nombreAdminReg" placeholder="Ej. Ana Maricela Admin" required>

                <label>Correo electrónico institucional/personal:</label>
                <input type="email" id="correoAdminReg" placeholder="Ej. ana24563@cbtis75.edu.mx" required>

                <label>Contraseña temporal:</label>
                <input type="password" id="passAdminReg" placeholder="Establece una contraseña segura" required>

                <button type="submit" class="btn-guardar" style="background-color: var(--rosa-oscuro);">Dar Alta como Administrador</button>
            </form>
        </div>
        
        <!-- FORMULARIO PARA AGREGAR PUBLICACIONES -->
        <div class="bloque-panel" id="moduloFormulario">
            <h2>🌱 Registrar Avance de tu Planta</h2>
            <form id="formBitacora" onsubmit="event.preventDefault(); guardarAvance();">
                <label>Nombre del Dueño/Integrante:</label>
                <input type="text" id="dueno" placeholder="Ej. Arely Barajas" required>

                <label>Tipo de Planta:</label>
                <select id="tipoPlanta">
                    <option value="Lavanda 🪻">Lavanda 🪻</option>
                    <option value="Menta 🍃">Menta 🍃</option>
                    <option value="Manzanilla 🌼">Manzanilla 🌼</option>
                    <option value="Sábila 🌵">Sábila 🌵</option>
                </select>

                <label>Altura de la planta (en cm):</label>
                <input type="number" id="altura" placeholder="Ej. 12" required>

                <label>¿Qué abono o cuidado usaste hoy?:</label>
                <input type="text" id="abono" placeholder="Ej. Tierra de hoja / Riego matutino" required>

                <label>Observaciones generales:</label>
                <textarea id="observaciones" rows="3" placeholder="¿Cómo notas las hojas o el crecimiento?" required></textarea>

                <button type="submit" class="btn-guardar">Publicar en Bitácora</button>
            </form>
        </div>

        <!-- LISTA DE PUBLICACIONES -->
        <div class="bloque-panel">
            <h2>📜 Historial de la Bitácora Colectiva</h2>
            <div id="contenedorHistorial">Cargando bitácoras...</div>
        </div>

    </div>

    <script>
        const API_URL = 'https://special-acorn-wrqr9vrw494v2544x-3000.app.github.dev';
        const token = localStorage.getItem('token');
        const rol = localStorage.getItem('rol');
        const nombreAdmin = localStorage.getItem('nombreAdmin');

        // Seguridad estricta: si no hay token válido regresamos al index
        if (!token) {
            window.location.href = 'index.html';
        }

        // Mostrar u ocultar herramientas de Administrador basándonos en el rol devuelto por el backend
        if (rol === 'admin') {
            document.getElementById('moduloAdministrador').classList.remove('hidden');
            if(nombreAdmin) {
                document.getElementById('saludoDashboard').innerText = `🌿 Panel Admin - ${nombreAdmin}`;
            }
        }

        async function cargarBitacora() {
            try {
                const res = await fetch(`${API_URL}/api/bitacora`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const datos = await res.json();
                const contenedor = document.getElementById('contenedorHistorial');
                contenedor.innerHTML = '';

                if (!datos || datos.length === 0) {
                    contenedor.innerHTML = '<p style="text-align:center; color:#60705a;">Aún no hay registros en el huertito. ¡Sé el primero!</p>';
                    return;
                }

                datos.reverse().forEach(p => {
                    contenedor.innerHTML += `
                        <div class="tarjeta-bitacora">
                            <h3>${p.tipoPlanta}</h3>
                            <p><strong>Responsable:</strong> ${p.dueno} | <strong>Fecha:</strong> ${p.fecha || ''}</p>
                            <p><strong>Medida:</strong> ${p.altura} cm | <strong>Cuidado:</strong> ${p.abono}</p>
                            <p style="background: white; padding: 10px; border-radius: 8px; border: 1px solid #f2cbd2;">
                                ${p.observaciones}
                            </p>
                        </div>
                    `;
                });
            } catch (err) {
                document.getElementById('contenedorHistorial').innerText = 'Nota: Trabajando en modo local/simulado.';
            }
        }

        async function guardarAvance() {
            const dueno = document.getElementById('dueno').value;
            const tipoPlanta = document.getElementById('tipoPlanta').value;
            const altura = document.getElementById('altura').value;
            const abono = document.getElementById('abono').value;
            const observaciones = document.getElementById('observaciones').value;

            try {
                const res = await fetch(`${API_URL}/api/bitacora`, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ dueno, tipoPlanta, altura, abono, observaciones })
                });

                if (res.ok) {
                    alert('¡Registro guardado con éxito! 🌿');
                    document.getElementById('formBitacora').reset();
                    cargarBitacora();
                } else {
                    alert('Error al guardar en el servidor.');
                }
            } catch (err) {
                alert('¡Guardado en modo simulación local! 🌸');
                insertarRegistroSimulado(dueno, tipoPlanta, altura, abono, observaciones);
            }
        }

        // 👑 FUNCIÓN PARA QUE EL ADMINISTRADOR AGREGUE OTROS ADMINS
        async function registrarAdministrador() {
            const nombre = document.getElementById('nombreAdminReg').value.trim();
            const correo = document.getElementById('correoAdminReg').value.trim().toLowerCase();
            const password = document.getElementById('passAdminReg').value;

            try {
                const res = await fetch(`${API_URL}/api/admin/registrar`, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ nombre, correo, password })
                });

                const data = await res.json();

                if(res.ok) {
                    alert(`¡Éxito! El usuario ${nombre} ha sido añadido al equipo como Administrador.`);
                    document.getElementById('formNuevoAdmin').reset();
                } else {
                    alert(data.error || 'Error creando el administrador.');
                }
            } catch (err) {
                alert('No se pudo conectar al servidor para guardar el Administrador.');
            }
        }

        function insertarRegistroSimulado(dueno, tipoPlanta, altura, abono, observaciones) {
            const contenedor = document.getElementById('contenedorHistorial');
            const simuladoHTML = `
                <div class="tarjeta-bitacora">
                    <h3>${tipoPlanta} (Simulado)</h3>
                    <p><strong>Responsable:</strong> ${dueno}</p>
                    <p><strong>Medida:</strong> ${altura} cm | <strong>Cuidado:</strong> ${abono}</p>
                    <p style="background: white; padding: 10px; border-radius: 8px; border: 1px solid #f2cbd2;">${observaciones}</p>
                </div>
            `;
            contenedor.innerHTML = simuladoHTML + contenedor.innerHTML;
            document.getElementById('formBitacora').reset();
        }

        function cerrarSesion() {
            localStorage.clear();
            window.location.href = 'index.html';
        }

        cargarBitacora();
    </script>
</body>
</html>
