<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌿 Instagram Huerto</title>
    <style>
        :root {
            --insta-bg: #fafafa;
            --insta-card: #ffffff;
            --primary: #2e7d32;
            --primary-dark: #1b5e20;
            --border: #dbdbdb;
            --text-main: #262626;
            --text-secondary: #8e8e8e;
        }

        body {
            font-family: '-apple-system', BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--insta-bg);
            color: var(--text-main);
            margin: 0;
            padding: 0;
        }

        /* --- BARRA DE NAVEGACIÓN ESTILO INSTAGRAM --- */
        nav {
            background-color: var(--insta-card);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav h1 {
            font-family: 'Segoe UI', sans-serif;
            font-size: 1.6rem;
            font-weight: bold;
            color: var(--primary);
            margin: 0;
            cursor: pointer;
        }

        .nav-buttons button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            margin-left: 10px;
            transition: background 0.2s;
        }

        .nav-buttons button:hover {
            background-color: var(--primary-dark);
        }

        .nav-buttons button.logout-btn {
            background-color: transparent;
            color: #ed4956;
            border: 1px solid #ed4956;
        }
        .nav-buttons button.logout-btn:hover {
            background-color: #fdf0f1;
        }

        /* --- CONTENEDOR DE VISTAS (SPA) --- */
        .view {
            display: none;
            max-width: 600px;
            margin: 20px auto;
            padding: 0 10px;
            box-sizing: border-box;
        }

        .view.active {
            display: block;
        }

        /* --- PANTALLA 1: ACCESO (LOGIN Y REGISTRO) --- */
        .auth-container {
            background: var(--insta-card);
            border: 1px solid var(--border);
            padding: 30px;
            border-radius: 8px;
            text-align: center;
            margin-top: 40px;
        }

        .auth-container h2 {
            color: var(--primary);
            margin-bottom: 20px;
        }

        .auth-input {
            width: 100%;
            padding: 10px;
            margin-bottom: 12px;
            border: 1px solid var(--border);
            border-radius: 4px;
            background: #fafafa;
            box-sizing: border-box;
            font-size: 14px;
        }

        .auth-input:focus {
            border-color: #a3a3a3;
            outline: none;
        }

        .auth-btn {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
        }

        .auth-btn:hover {
            background-color: var(--primary-dark);
        }

        .switch-text {
            margin-top: 20px;
            color: var(--text-secondary);
            font-size: 14px;
        }

        .switch-text span {
            color: var(--primary);
            cursor: pointer;
            font-weight: bold;
        }

        /* --- FORMULARIO DE SUBIDA (ESTILO INSTAGRAM POST) --- */
        .upload-card {
            background: var(--insta-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 30px;
        }

        .upload-card h3 {
            margin-top: 0;
            color: var(--primary);
            text-align: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
        }

        .upload-card label {
            display: block;
            margin: 10px 0 5px 0;
            font-weight: 600;
            font-size: 14px;
        }

        /* --- PANTALLA 2: FEED DE PUBLICACIONES (ESTILO INSTAGRAM) --- */
        .insta-post {
            background-color: var(--insta-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            margin-bottom: 24px;
            overflow: hidden;
        }

        /* Encabezado del Post */
        .post-header {
            display: flex;
            align-items: center;
            padding: 12px 16px;
        }

        .post-avatar {
            width: 32px;
            height: 32px;
            background-color: var(--primary);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
            margin-right: 12px;
        }

        .post-user-info {
            display: flex;
            flex-direction: column;
        }

        .post-username {
            font-weight: 600;
            font-size: 14px;
        }

        .post-date {
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        /* Imagen del Post */
        .post-img {
            width: 100%;
            max-height: 500px;
            object-fit: cover;
            display: block;
            border-top: 1px solid #f0f0f0;
            border-bottom: 1px solid #f0f0f0;
        }

        /* Cuerpo / Detalles del Post */
        .post-body {
            padding: 16px;
            font-size: 14px;
            line-height: 1.5;
        }

        .post-badge {
            background-color: var(--primary-light);
            color: var(--primary);
            padding: 3px 8px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 12px;
            display: inline-block;
            margin-bottom: 8px;
        }

        .post-caption {
            margin: 5px 0 0 0;
        }

        .post-caption strong {
            margin-right: 8px;
        }
    </style>
</head>
<body>

    <nav>
        <h1 onclick="showView('view-feed')">🌿 Huertogram</h1>
        <div class="nav-buttons" id="navButtons">
            <button id="btnNavFeed" onclick="showView('view-feed')" style="display:none;">Feed</button>
            <button id="btnNavSubir" onclick="showView('view-subir')" style="display:none;">+ Nueva Foto</button>
            <button id="btnNavLogout" onclick="logout()" class="logout-btn" style="display:none;">Salir</button>
        </div>
    </nav>

    <div id="view-login" class="view active">
        <div class="auth-container">
            <h2>Huertogram</h2>
            <form id="loginForm">
                <input type="email" id="loginCorreo" class="auth-input" required placeholder="Correo electrónico">
                <input type="password" id="loginPass" class="auth-input" required placeholder="Contraseña">
                <button type="submit" class="auth-btn">Iniciar Sesión</button>
            </form>
            <p class="switch-text">¿No tienes una cuenta? <span onclick="showView('view-registro')">Regístrate</span></p>
        </div>
    </div>

    <div id="view-registro" class="view">
        <div class="auth-container">
            <h2>Crear Cuenta</h2>
            <form id="registroForm">
                <input type="text" id="regNombre" class="auth-input" required placeholder="Nombre completo">
                <input type="email" id="regCorreo" class="auth-input" required placeholder="Correo electrónico">
                <input type="password" id="regPass" class="auth-input" required placeholder="Contraseña (mínimo 6 caracteres)">
                <button type="submit" class="auth-btn" style="background-color: #0095f6;">Registrarse</button>
            </form>
            <p class="switch-text">¿Ya tienes cuenta? <span onclick="showView('view-login')">Inicia sesión</span></p>
        </div>
    </div>

    <div id="view-feed" class="view">
        <div id="feedContenedor">Cargando publicaciones...</div>
    </div>

    <div id="view-subir" class="view">
        <div class="upload-card">
            <h3>Crear nueva publicación</h3>
            <form id="bitacoraForm">
                <label>Planta / Cultivo:</label>
                <input type="text" name="tipoPlanta" class="auth-input" required placeholder="Ej: Lavanda, Tomates Orgánicos">
                
                <label>Altura actual (cm):</label>
                <input type="number" name="altura" class="auth-input" required placeholder="Ej: 24">
                
                <label>Nutrientes / Abono:</label>
                <input type="text" name="abono" class="auth-input" placeholder="Ej: Compost de café, ninguno">
                
                <label>Descripción / Observaciones:</label>
                <textarea name="observaciones" class="auth-input" rows="4" placeholder="Escribe un pie de foto para tu planta..."></textarea>
                
                <label>Seleccionar Foto (obligatorio):</label>
                <input type="file" name="imagen" accept="image/*" required style="margin-bottom: 15px;">
                
                <button type="submit" class="auth-btn">Compartir Publicación</button>
            </form>
        </div>
    </div>

    <script>
        // --- CONTROLADOR DE VISTAS (SPA) ---
        function showView(viewId) {
            const token = localStorage.getItem('token');

            // Si no hay sesión, obligar a quedarse en login o registro
            if ((viewId === 'view-feed' || viewId === 'view-subir') && !token) {
                viewId = 'view-login';
            }

            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');

            if (viewId === 'view-feed') {
                cargarFeed();
            }
        }

        function ajustarMenu() {
            const token = localStorage.getItem('token');
            if (token) {
                document.getElementById('btnNavFeed').style.display = 'inline-block';
                document.getElementById('btnNavSubir').style.display = 'inline-block';
                document.getElementById('btnNavLogout').style.display = 'inline-block';
            } else {
                document.getElementById('btnNavFeed').style.display = 'none';
                document.getElementById('btnNavSubir').style.display = 'none';
                document.getElementById('btnNavLogout').style.display = 'none';
            }
        }

        function logout() {
            localStorage.clear();
            ajustarMenu();
            showView('view-login');
        }

        // --- ENVIAR REGISTRO NUEVO DE USUARIO ---
        document.getElementById('registroForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = {
                nombre: document.getElementById('regNombre').value,
                correo: document.getElementById('regCorreo').value,
                password: document.getElementById('regPass').value
            };

            const res = await fetch('/api/registro', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });

            if (res.ok) {
                alert("¡Cuenta de Huertogram creada! Ya puedes iniciar tu sesión.");
                document.getElementById('registroForm').reset();
                showView('view-login');
            } else {
                alert("Error al registrarte. Revisa los datos.");
            }
        });

        // --- INICIAR SESIÓN ---
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = {
                correo: document.getElementById('loginCorreo').value,
                password: document.getElementById('loginPass').value
            };

            const res = await fetch('/api/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });
            const info = await res.json();
            
            if (info.token) {
                localStorage.setItem('token', info.token);
                ajustarMenu();
                showView('view-feed');
            } else {
                alert("Credenciales incorrectas.");
            }
        });

        // --- OBTENER EL FEED DE INSTAGRAM (BITÁCORA MONGO) ---
        async function cargarFeed() {
            const contenedor = document.getElementById('feedContenedor');
            try {
                const res = await fetch('/api/bitacora');
                const publicaciones = await res.json();
                
                if (publicaciones.length === 0) {
                    contenedor.innerHTML = '<p style="text-align:center; color:#8e8e8e; padding: 40px 0;">No hay fotos publicadas en el feed todavía.</p>';
                    return;
                }

                contenedor.innerHTML = publicaciones.map(post => {
                    const inicial = post.tipoPlanta ? post.tipoPlanta.charAt(0).toUpperCase() : '🌿';
                    const fechaFormateada = new Date(post.fecha).toLocaleDateString('es-ES', {
                        day: 'numeric', month: 'long', year: 'numeric'
                    });

                    return `
                        <div class="insta-post">
                            <div class="post-header">
                                <div class="post-avatar">${inicial}</div>
                                <div class="post-user-info">
                                    <span class="post-username">${post.tipoPlanta}</span>
                                    <span class="post-date">Publicado el ${fechaFormateada}</span>
                                </div>
                            </div>
                            
                            ${post.imagenUrl ? `<img src="${post.imagenUrl}" class="post-img" alt="Foto del huerto">` : ''}
                            
                            <div class="post-body">
                                <div class="post-badge">📏 Altura: ${post.altura} cm</div>
                                ${post.abono ? `<div class="post-badge" style="background:#fff3e0; color:#e65100;">🧪 Abono: ${post.abono}</div>` : ''}
                                <p class="post-caption">
                                    <strong>@bitacora_huerto</strong> ${post.observaciones || 'Sin descripción en esta fotografía.'}
                                </p>
                            </div>
                        </div>
                    `;
                }).join('');
            } catch (error) {
                contenedor.innerHTML = '<p style="color:red; text-align:center;">Error al cargar el feed de Instagram.</p>';
            }
        }

        // --- PUBLICAR NUEVA ENTRADA (CON LA CORRECCIÓN DE CAMPOS NAME) ---
        document.getElementById('bitacoraForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            // Esto atrapa los atributos 'name' del formulario tal como los pide Multer
            const formData = new FormData(e.target);

            try {
                const res = await fetch('/api/bitacora', {
                    method: 'POST',
                    body: formData
                });

                if (res.ok) {
                    alert('📸 ¡Tu foto se ha publicado con éxito en el feed!');
                    document.getElementById('bitacoraForm').reset();
                    showView('view-feed'); // Te redirige automáticamente a ver el Instagram
                } else {
                    alert('Error al subir la publicación.');
                }
            } catch (error) {
                alert('Error de red al conectar al servidor.');
            }
        });

        // --- AL CARGAR LA PÁGINA ---
        window.onload = () => {
            ajustarMenu();
            const token = localStorage.getItem('token');
            if (token) {
                showView('view-feed');
            } else {
                showView('view-login');
            }
        };
    </script>
</body>
</html>
