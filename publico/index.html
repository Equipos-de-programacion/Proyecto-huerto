<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌿 Huertogram</title>
    <style>
        :root {
            --insta-bg: #fafafa;
            --insta-card: #ffffff;
            --primary: #2e7d32;
            --primary-dark: #1b5e20;
            --border: #dbdbdb;
            --text-main: #262626;
            --text-secondary: #8e8e8e;
        }

        body {
            font-family: '-apple-system', BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--insta-bg);
            color: var(--text-main);
            margin: 0;
            padding: 0;
        }

        /* --- BARRA DE NAVEGACIÓN --- */
        nav {
            background-color: var(--insta-card);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav h1 {
            font-size: 1.6rem;
            font-weight: bold;
            color: var(--primary);
            margin: 0;
            cursor: pointer;
        }

        .nav-buttons button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .nav-buttons button.logout-btn {
            background-color: transparent;
            color: #ed4956;
            border: 1px solid #ed4956;
            margin-left: 10px;
        }

        /* --- CONTROLADOR DE VISTAS --- */
        .view {
            display: none;
            max-width: 600px;
            margin: 20px auto;
            padding: 0 10px;
            box-sizing: border-box;
        }

        .view.active {
            display: block;
        }

        /* --- PANTALLA 1: ACCESO (LOGIN / REGISTRO) --- */
        .auth-box {
            background: var(--insta-card);
            border: 1px solid var(--border);
            padding: 30px;
            border-radius: 8px;
            text-align: center;
            margin-top: 40px;
        }

        .auth-box h2 {
            color: var(--primary);
            font-size: 2rem;
            margin-bottom: 25px;
        }

        .auth-input {
            width: 100%;
            padding: 11px;
            margin-bottom: 12px;
            border: 1px solid var(--border);
            border-radius: 4px;
            background: #fafafa;
            box-sizing: border-box;
            font-size: 14px;
        }

        .auth-btn {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            margin-top: 5px;
        }

        .switch-form {
            margin-top: 25px;
            font-size: 14px;
            color: var(--text-secondary);
        }

        .switch-form span {
            color: #0095f6;
            cursor: pointer;
            font-weight: 600;
        }

        /* --- PANTALLA 2: SECCIÓN PARA CREAR POST (ARRIBA DEL FEED) --- */
        .upload-section {
            background: var(--insta-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 24px;
        }

        .upload-section h3 {
            margin: 0 0 15px 0;
            color: var(--primary);
            font-size: 16px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 8px;
        }

        .upload-section label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 4px;
            color: #444;
        }

        /* --- TARJETAS DEL FEED (ESTILO INSTAGRAM POST) --- */
        .insta-post {
            background-color: var(--insta-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            margin-bottom: 28px;
            overflow: hidden;
        }

        .post-header {
            display: flex;
            align-items: center;
            padding: 14px;
        }

        .post-avatar {
            width: 36px;
            height: 36px;
            background-color: var(--primary-light);
            color: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 15px;
            margin-right: 12px;
            border: 1px solid var(--border);
        }

        .post-meta {
            display: flex;
            flex-direction: column;
        }

        .post-title {
            font-weight: 600;
            font-size: 14px;
        }

        .post-date {
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        .post-img {
            width: 100%;
            max-height: 500px;
            object-fit: cover;
            display: block;
        }

        .post-footer {
            padding: 16px;
            font-size: 14px;
        }

        .post-badges {
            margin-bottom: 10px;
        }

        .badge {
            display: inline-block;
            background: var(--insta-bg);
            border: 1px solid var(--border);
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            margin-right: 6px;
        }

        .post-caption {
            margin: 8px 0 0 0;
            line-height: 1.4;
        }

        .post-caption strong {
            color: var(--text-main);
            margin-right: 6px;
        }
    </style>
</head>
<body>

    <nav>
        <h1 onclick="showView('view-feed')">🌿 Huertogram</h1>
        <div class="nav-buttons">
            <button id="btnLogout" onclick="logout()" class="logout-btn" style="display:none;">Salir</button>
        </div>
    </nav>

    <div id="view-auth" class="view active">
        <div id="box-login" class="auth-box">
            <h2>Huertogram</h2>
            <form id="loginForm">
                <input type="email" id="loginCorreo" class="auth-input" required placeholder="Correo electrónico">
                <input type="password" id="loginPass" class="auth-input" required placeholder="Contraseña">
                <button type="submit" class="auth-btn">Iniciar Sesión</button>
            </form>
            <p class="switch-form">¿No tienes cuenta? <span onclick="toggleAuthForms(false)">Regístrate</span></p>
        </div>

        <div id="box-registro" class="auth-box" style="display: none;">
            <h2>Crear Cuenta</h2>
            <form id="registroForm">
                <input type="text" id="regNombre" class="auth-input" required placeholder="Nombre completo">
                <input type="email" id="regCorreo" class="auth-input" required placeholder="Correo electrónico">
                <input type="password" id="regPass" class="auth-input" required placeholder="Contraseña (mínimo 6 caracteres)">
                <button type="submit" class="auth-btn" style="background-color: #0095f6;">Registrarse</button>
            </form>
            <p class="switch-form">¿Ya tienes cuenta? <span onclick="toggleAuthForms(true)">Inicia sesión</span></p>
        </div>
    </div>

    <div id="view-feed" class="view">
        
        <div class="upload-section">
            <h3>✨ Compartir progreso del Huerto</h3>
            <form id="bitacoraForm">
                <label>Planta / Cultivo:</label>
                <input type="text" name="tipoPlanta" class="auth-input" required placeholder="Ej: Tomates, Menta, Girasol...">
                
                <label>Altura (cm):</label>
                <input type="number" name="altura" class="auth-input" required placeholder="Ej: 35">
                
                <label>Abono / Nutrientes:</label>
                <input type="text" name="abono" class="auth-input" placeholder="Ej: Humus de lombriz, ninguno">
                
                <label>¿Qué hay de nuevo hoy? (Observaciones):</label>
                <textarea name="observaciones" class="auth-input" rows="3" placeholder="Escribe un pie de foto..."></textarea>
                
                <label>Subir Foto:</label>
                <input type="file" name="imagen" accept="image/*" required style="margin-bottom: 12px; font-size: 13px;">
                
                <button type="submit" class="auth-btn">Publicar Foto</button>
            </form>
        </div>

        <div id="feedContenedor">Cargando la galería...</div>
    </div>

    <script>
        // --- INTERCAMBIAR ENTRE LOGIN Y REGISTRO ---
        function toggleAuthForms(showLogin) {
            document.getElementById('box-login').style.display = showLogin ? 'block' : 'none';
            document.getElementById('box-registro').style.display = showLogin ? 'none' : 'block';
        }

        // --- SISTEMA NATIVO DE 2 PÁGINAS ---
        function showView(viewId) {
            const token = localStorage.getItem('token');

            // Protección: Si no está logueado va directo a Auth
            if (viewId === 'view-feed' && !token) {
                viewId = 'view-auth';
            }

            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');

            if (viewId === 'view-feed') {
                document.getElementById('btnLogout').style.display = 'inline-block';
                cargarPublicaciones();
            } else {
                document.getElementById('btnLogout').style.display = 'none';
            }
        }

        function logout() {
            localStorage.clear();
            showView('view-auth');
        }

        // --- ACCIÓN: CREAR CUENTA ---
        document.getElementById('registroForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = {
                nombre: document.getElementById('regNombre').value,
                correo: document.getElementById('regCorreo').value,
                password: document.getElementById('regPass').value
            };

            const res = await fetch('/api/registro', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });

            if (res.ok) {
                alert("¡Registro exitoso! Tu cuenta tiene permisos de Administrador automáticamente.");
                document.getElementById('registroForm').reset();
                toggleAuthForms(true); // Te manda al login
            } else {
                alert("Error al crear la cuenta.");
            }
        });

        // --- ACCIÓN: INICIAR SESIÓN ---
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = {
                correo: document.getElementById('loginCorreo').value,
                password: document.getElementById('loginPass').value
            };

            const res = await fetch('/api/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });
            const info = await res.json();
            
            if (info.token) {
                localStorage.setItem('token', info.token);
                document.getElementById('loginForm').reset();
                showView('view-feed'); // Pasa al feed directo
            } else {
                alert("Correo o contraseña incorrectos.");
            }
        });

        // --- ACCIÓN: RENDERIZAR FEED ESTILO INSTAGRAM ---
        async function cargarPublicaciones() {
            const contenedor = document.getElementById('feedContenedor');
            try {
                const res = await fetch('/api/bitacora');
                const datos = await res.json();
                
                if (datos.length === 0) {
                    contenedor.innerHTML = '<p style="text-align:center; color:#999; padding:30px;">Aún no hay fotos en el huerto. ¡Sé el primero en subir una!</p>';
                    return;
                }

                contenedor.innerHTML = datos.map(post => {
                    const inicial = post.tipoPlanta ? post.tipoPlanta.charAt(0).toUpperCase() : '🌱';
                    const fecha = new Date(post.fecha).toLocaleDateString('es-MX', {
                        day: 'numeric', month: 'short', year: 'numeric'
                    });

                    return `
                        <div class="insta-post">
                            <div class="post-header">
                                <div class="post-avatar">${inicial}</div>
                                <div class="post-meta">
                                    <span class="post-title">${post.tipoPlanta}</span>
                                    <span class="post-date">Subido el ${fecha}</span>
                                </div>
                            </div>
                            
                            ${post.imagenUrl ? `<img src="${post.imagenUrl}" class="post-img" alt="Foto del huerto">` : ''}
                            
                            <div class="post-footer">
                                <div class="post-badges">
                                    <span class="badge">📏 ${post.altura} cm</span>
                                    ${post.abono ? `<span class="badge" style="background-color:#fff3e0; color:#e65100;">🧪 ${post.abono}</span>` : ''}
                                </div>
                                <p class="post-caption">
                                    <strong>@huerto_comunidad</strong> ${post.observaciones || 'Sin pie de foto.'}
                                </p>
                            </div>
                        </div>
                    `;
                }).join('');
            } catch (error) {
                contenedor.innerHTML = '<p style="color:red; text-align:center;">Error de conexión con la base de datos.</p>';
            }
        }

        // --- ACCIÓN: SUBIR POST (FORM DATA PERFECTO PARA MULTER) ---
        document.getElementById('bitacoraForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);

            try {
                const res = await fetch('/api/bitacora', {
                    method: 'POST',
                    body: formData
                });

                if (res.ok) {
                    alert('📸 ¡Tu publicación fue compartida en el feed con éxito!');
                    document.getElementById('bitacoraForm').reset();
                    cargarPublicaciones(); // Recarga instantáneamente el feed abajo
                } else {
                    alert('Error al publicar.');
                }
            } catch (error) {
                alert('Error de red.');
            }
        });

        // Verificación inicial al cargar
        window.onload = () => {
            if (localStorage.getItem('token')) {
                showView('view-feed');
            } else {
                showView('view-auth');
            }
        };
    </script>
</body>
</html>
