<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MUSU - Panel de Alta Gestión Administrativa</title>
    <style>
        :root {
            --rosa-principal: #fcd7de;  
            --rosa-intenso: #e58fa2;    
            --rosa-oscuro: #8c4354;     
            --verde-huerto: #4d693f;    
            --blanco: #ffffff;
        }

        body { font-family: system-ui, sans-serif; background-color: #faf4f5; margin: 0; padding: 30px; }
        .admin-box { max-width: 700px; margin: 0 auto; background: var(--blanco); border-radius: 20px; padding: 35px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); border: 1px solid #f0e2e5; }
        h2 { color: var(--rosa-oscuro); text-align: center; margin-top: 0; border-bottom: 3px solid var(--rosa-principal); padding-bottom: 10px; }
        
        .section-block { background-color: #fff9fa; border: 1px solid #fce8eb; padding: 20px; border-radius: 12px; margin-bottom: 25px; }
        h3 { margin-top: 0; color: var(--verde-huerto); }

        input, textarea { width: 100%; margin-bottom: 14px; padding: 12px; border: 1px solid #ddd; border-radius: 10px; box-sizing: border-box; }
        button { background-color: var(--verde-huerto); color: white; border: none; padding: 12px 20px; border-radius: 10px; font-weight: bold; width: 100%; cursor: pointer; font-size: 1rem; }
        button:hover { background-color: #3d5432; }
        
        .back-link { display: block; text-align: center; margin-top: 20px; color: var(--rosa-oscuro); font-weight: bold; text-decoration: none; }
        .user-row { display: flex; justify-content: space-between; align-items: center; background: white; padding: 10px; border-radius: 8px; margin-bottom: 8px; border: 1px solid #eee; }
    </style>
</head>
<body>

    <div class="admin-box">
        <h2>⚙️ Consola de Mando Administrativo</h2>
        
        <div class="section-block">
            <h3>👑 Ascender Colaboradores a Administrador</h3>
            <p style="font-size: 0.9rem; color: #555;">Ingresa el correo exacto del compañero registrado para otorgarle permisos globales:</p>
            <form onsubmit="event.preventDefault(); otorgarAdmin();">
                <input type="email" id="correoDestino" placeholder="correo@ejemplo.com" required>
                <button type="submit" style="background-color: var(--rosa-oscuro);">Otorgar Rango Admin ✨</button>
            </form>
        </div>

        <div class="section-block">
            <h3>📢 Publicar Circular en el Tablón</h3>
            <form id="formAnuncio" onsubmit="event.preventDefault(); lanzarAnuncio();">
                <input type="text" id="titAnuncio" placeholder="Título del Anuncio Oficial" required>
                <textarea id="contAnuncio" placeholder="Mensaje para toda la comunidad del huerto..." rows="4" required></textarea>
                
                <label style="font-weight: bold; font-size: 0.85rem; display: block; margin-bottom: 5px;">Adjuntar Documento de Respaldo o Evidencia (Imagen/Archivo):</label>
                <input type="file" id="archivoAnuncio">

                <button type="submit">Emitir Anuncio en el Muro</button>
            </form>
        </div>

        <a href="dashboard.html" class="back-link">⬅️ Volver a la Bitácora General</a>
    </div>

    <script>
        const API_URL = 'http://localhost:3000';
        const token = localStorage.getItem('token');
        const rol = localStorage.getItem('rol');

        // Restricción de seguridad del cliente
        if(!token || rol !== 'admin') {
            alert("Acceso denegado de forma automática.");
            window.location.href = 'dashboard.html';
        }

        async function otorgarAdmin() {
            const correo = document.getElementById('correoDestino').value;

            const res = await fetch(`${API_URL}/api/usuarios/hacer-admin`, {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({ correo })
            });

            const data = await res.json();
            if(res.ok) {
                alert(data.mensaje);
                document.getElementById('correoDestino').value = '';
            } else {
                alert(data.error);
            }
        }

        async function lanzarAnuncio() {
            const formData = new FormData();
            formData.append('titulo', document.getElementById('titAnuncio').value);
            formData.append('contenido', document.getElementById('contAnuncio').value);

            const fileInput = document.getElementById('archivoAnuncio');
            if(fileInput.files[0]) {
                formData.append('archivo', fileInput.files[0]);
            }

            const res = await fetch(`${API_URL}/api/anuncios`, {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${token}` },
                body: formData
            });

            if(res.ok) {
                alert('¡Anuncio emitido y subido correctamente!');
                document.getElementById('formAnuncio').reset();
            } else {
                alert('No se pudo procesar la publicación del aviso.');
            }
        }
    </script>
</body>
</html>
