<script>
    if(!localStorage.getItem('rol')) {
        localStorage.setItem('rol', 'admin');
    }

    const token = localStorage.getItem('token');
    const rol = localStorage.getItem('rol');

    // Cambia esto por la URL larga de tu Codespaces actual
    const API_URL = 'https://special-acorn-wrqr9vrw494v2544x-3000.app.github.dev';

    async function subirImagen() {
        const input = document.getElementById('imagenInput');
        if(input.files.length === 0) return alert("Elige una foto.");

        const formData = new FormData();
        formData.append('imagen', input.files[0]);

        const res = await fetch(`${API_URL}/api/bitacora`, { 
            method: 'POST',
            headers: { 'Authorization': `Bearer ${token || 'TOKEN_DEMO_HUERTITO'}` },
            body: formData
        });
        
        if(res.ok) {
            const data = await res.json();
            alert('¡Imagen subida con éxito!');
            window.location.href = '/dashboard.html'; 
        } else {
            alert('Error al subir la imagen.');
        }
    }
</script>
